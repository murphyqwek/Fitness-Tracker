name: Analytics EF Migration and CD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Create Analytics EF Migration Bundle
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=dummy"
        run: |
          dotnet tool install --global dotnet-ef

          dotnet ef migrations bundle \
            --project Fintess-Tracker-Analytics/Fintess-Tracker-Analytics.csproj \
            --startup-project Fintess-Tracker-Analytics/Fintess-Tracker-Analytics.csproj \
            --output analytics-efbundle \
            --self-contained

      - name: Run Analytics Migration Bundle
        run: |
          chmod +x ./analytics-efbundle

          ./analytics-efbundle \
            --connection "${{ secrets.ANALYTICS_DB_CONNECTION_STRING }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_LOGIN }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Analytics
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Fintess-Tracker-Analytics/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_LOGIN }}/myprojects:analytics-latest

      - name: Update Analytics
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ${{ secrets.PATH_TO_DOCKER_COMPOSE }}
            docker compose pull analytcs
            docker compose up -d analytcs
version: '3.8'

x-container-logging: &container-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  postgre_data: 

services:
  app:
    image: ${IMAGE_NAME}
    container_name: app-container
    restart: unless-stopped
    logging: *container-logging
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER_APP};Password=${DB_PASSWORD_APP};Maximum Pool Size=${DB_MAX_POOL_SIZE};Minimum Pool Size=1;Timeout=15;
      - ConnectionStrings__Redis=${INFRA_WIREGUARD_IP:-10.50.0.2}:6379,password=${REDIS_PASSWORD}
      - Kafka__BootstrapServers=${INFRA_WIREGUARD_IP:-10.50.0.2}:9092
      - Jwt__PublicKeyPath=${JWT_PUBLIC_KEY_CONTAINER_PATH}
      - Jwt__PrivateKeyPath=${JWT_PRIVATE_KEY_CONTAINER_PATH}
    depends_on:
      - db
    ports:
      - "8080:8080"
      - "${APP_WIREGUARD_IP:-10.50.0.1}:9091:9091"
    networks:
      - app-network
    volumes:
      - ${JWT_PUBLIC_KEY_HOST_PATH}:${JWT_PUBLIC_KEY_CONTAINER_PATH}:ro
      - ${JWT_PRIVATE_KEY_HOST_PATH}:${JWT_PRIVATE_KEY_CONTAINER_PATH}:ro
      
  analytcs:
    image: ${ANALYTICS_IMAGE_NAME}
    container_name: analytcs-container
    restart: unless-stopped
    logging: *container-logging
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=4545
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER_APP};Password=${DB_PASSWORD_APP};Maximum Pool Size=${DB_MAX_POOL_SIZE};Minimum Pool Size=1;Timeout=15;
      - ConnectionStrings__Redis=${INFRA_WIREGUARD_IP:-10.50.0.2}:6379,password=${REDIS_PASSWORD}
      - Kafka__BootstrapServers=${INFRA_WIREGUARD_IP:-10.50.0.2}:9092
      - Kafka__GroupId=${Kafka_Analytics_GroupId}
      - Jwt__PublicKeyPath=${JWT_PUBLIC_KEY_CONTAINER_PATH}
    depends_on:
        - db
    networks:
        - app-network
        
    ports:
        - "4545:4545"
    volumes:
      - ${JWT_PUBLIC_KEY_HOST_PATH}:${JWT_PUBLIC_KEY_CONTAINER_PATH}:ro
  
  db:
    image: postgres:18-alpine3.23
    container_name: db-container
    logging: *container-logging
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER_APP}
      - POSTGRES_PASSWORD=${DB_PASSWORD_APP}
      - POSTGRES_DB=${DB_NAME}
    command: postgres -c max_connections=30 -c shared_buffers=256MB
    ports:
      - "${DB_OUT_PORT}:5432"
    volumes:
      - postgre_data:/var/lib/postgresql/
    networks:
      - app-network

